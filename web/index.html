<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Level Chrome</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="meter" aria-label="Sound level dashboard">
      <div class="topbar">
        <div>
          <h1>Sound Level</h1>
          <p id="status">Ready</p>
        </div>
        <div class="actions">
          <button id="connect" type="button">Connect</button>
          <button id="disconnect" type="button" disabled>Disconnect</button>
          <button id="clear" type="button">Clear</button>
        </div>
      </div>

      <section class="hero">
        <div class="readout">
          <div>
            <div id="value" class="value">--.-</div>
            <div id="unit" class="unit">dBA</div>
          </div>
          <div id="band" class="band">Waiting</div>
        </div>

        <aside class="side">
          <div class="stats">
            <div><span>Peak</span><strong id="peak">--.-</strong></div>
            <div><span>Average</span><strong id="avg">--.-</strong></div>
            <div><span>Samples</span><strong id="samples">0</strong></div>
            <div><span>Device</span><strong id="device">Not connected</strong></div>
            <div><span>Battery</span><strong id="battery">--</strong></div>
            <div><span>Auto-off</span><strong id="autoOff">--</strong></div>
            <div><span>Range</span><strong id="range">--</strong></div>
            <div><span>Overload</span><strong id="overload">--</strong></div>
            <div><span>Backlight</span><strong id="backlight">--</strong></div>
          </div>
          <div class="statusline"><span id="dot" class="dot"></span><span id="mode">Web Bluetooth</span></div>
        </aside>
      </section>

      <section class="chartShell">
        <canvas id="chart" aria-label="Sound history chart"></canvas>
      </section>

      <div class="bands">
        <div><span class="swatch ideal"></span>Ideal to 85 dB</div>
        <div><span class="swatch watch"></span>Watch 85-95 dB</div>
        <div><span class="swatch unsafe"></span>Too high 95+ dB</div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
